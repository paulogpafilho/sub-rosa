<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in · Sub-Rosa</title></head>
<body>
<main>
  <h1>Sign in to Sub-Rosa</h1>
  <p role="alert" th:if="${param.error}">Invalid credentials</p>
  <p th:if="${param.logout}">You have signed out.</p>
  <form th:action="@{/login}" method="post">
    <p><label for="username">Username</label> <input id="username" name="username" autocomplete="username" maxlength="200" required></p>
    <p><label for="password">Password</label> <input id="password" name="password" type="password" autocomplete="current-password" required></p>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
