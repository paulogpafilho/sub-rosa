spring:
  application:
    name: sub-rosa
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  datasource:
    url: ${IDP_DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  session:
    timeout: ${IDP_SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  flyway:
    enabled: true
server:
  port: ${IDP_PORT:9000}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: true
idp:
  issuer: ${IDP_ISSUER}
  identity:
    bcrypt-cost: ${IDP_BCRYPT_COST:12}
    password-max-bytes: ${IDP_PASSWORD_MAX_BYTES:72}
    lockout-failures: ${IDP_LOCKOUT_FAILURES:5}
    lockout-duration: ${IDP_LOCKOUT_DURATION:15m}
    ip-attempts: ${IDP_IP_ATTEMPTS:20}
    ip-window: ${IDP_IP_WINDOW:1m}
    ip-capacity: ${IDP_IP_CAPACITY:10000}
    session-idle-timeout: ${IDP_SESSION_IDLE_TIMEOUT:30m}
    session-absolute-timeout: ${IDP_SESSION_ABSOLUTE_TIMEOUT:8h}
    admin-user: ${IDP_ADMIN_USER:}
    admin-password: ${IDP_ADMIN_PASSWORD:}
logging:
  structured:
    format:
      console: ecs
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
